services:
  bigtable-emulator:
    image: google/cloud-sdk:latest
    ports:
      - "8086:8086"
    command: >
      gcloud beta emulators bigtable start
      --host-port=0.0.0.0:8086
    environment:
      - CLOUDSDK_CORE_DISABLE_PROMPTS=1
    # The emulator speaks gRPC (h2c) only; an HTTP/1.1 probe never returns 2xx,
    # so check that the port accepts a TCP connection instead.
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8086'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
